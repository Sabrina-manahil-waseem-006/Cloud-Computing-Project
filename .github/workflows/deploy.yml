name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cea-web:latest ./web
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cea-web:latest

      - name: Build and push App image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cea-app:latest ./app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cea-app:latest

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/azureuser/app || exit 1
            docker compose pull
            docker compose up -d 
